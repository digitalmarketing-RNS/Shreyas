# Production add-on: HTTPS on your own domain with Caddy (certificates are automatic).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Needs DOMAIN in .env, a DNS A record pointing DOMAIN at this server, and ports 80/443 open.
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      - wa-reach
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env, e.g. app.yourbrand.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
