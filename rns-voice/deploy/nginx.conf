# Nginx site for the RNS Voice Agent.
# The Upgrade/Connection headers are what let call audio through; without them
# calls connect and stay silent.

upstream rns_voice {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name your-domain.com;
    # certbot rewrites this block to redirect to https.

    client_max_body_size 30m;

    location / {
        proxy_pass         http://rns_voice;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A call can run for many minutes with no HTTP-level traffic, and the
        # server-sent event stream is open indefinitely.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Audio must not sit in a buffer waiting to be flushed.
        proxy_buffering off;
    }
}
