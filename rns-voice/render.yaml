# Render blueprint. Render proxies WebSockets on every tier including the free
# one, which is the reason to prefer it over shared hosting for this app.
#
# Deploy: push this repo to GitHub, then in Render choose
# New -> Blueprint and point it at the repo. Set the secret values in the
# dashboard when prompted; they are marked sync:false so they are never
# committed.
services:
  - type: web
    name: rns-voice-agent
    runtime: node
    plan: free
    # The app is in a subfolder of the repository.
    rootDir: rns-voice
    buildCommand: npm install --omit=dev
    startCommand: node app.js
    healthCheckPath: /healthz

    # Without this the container's filesystem is rebuilt on every deploy, and
    # on the free plan on every wake from sleep, taking campaigns, leads, call
    # history and the opt-out list with it. Nothing errors — the dashboard
    # simply comes back empty. A disk needs a paid instance type; until then
    # treat anything in the dashboard as losable, and keep your opt-out list
    # somewhere you can re-import it from.
    # disk:
    #   name: rns-voice-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      # Uncomment together with the disk above.
      # - key: DATA_DIR
      #   value: /var/data
      - key: XAI_AGENT_ID
        value: agent_CvgfdQIkeaZ1IGqg
      - key: PLIVO_PHONE_NUMBER
        value: "+918031705594"
      - key: DEFAULT_COUNTRY_CODE
        value: "91"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: BRAND_NAME
        value: RNS
      - key: MAX_CONCURRENT_CALLS
        value: "5"
      # Entered in the Render dashboard, never stored in this file.
      - key: XAI_API_KEY
        sync: false
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # Set this to the URL Render assigns once the first deploy finishes.
      - key: PUBLIC_BASE_URL
        sync: false
